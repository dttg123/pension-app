<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="연금저축과 IRP를 장기간 관리하는 개인연금 웹앱">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <title>개인연금 V4.1.0</title>
  <script>
    (()=>{try{const raw=localStorage.getItem('pension-v1');const mode=raw?JSON.parse(raw)?.settings?.theme:'auto';const dark=mode==='dark'||(mode!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.dataset.themeMode=['auto','light','dark'].includes(mode)?mode:'auto'}catch(_){document.documentElement.dataset.theme='light';document.documentElement.dataset.themeMode='auto'}})();
  </script>
  <link rel="stylesheet" href="app.css?v=4.1.0">
</head>
<body>
  <div class="appShell">
    <header class="topbar">
      <div class="brand">
        <div class="brandLine"><h1>개인연금</h1><button id="versionBadge" class="versionBadge" aria-label="앱 버전 V4.1.0 정보">V4.1.0</button></div>
        <div class="subtitle" id="headerSub"></div>
      </div>
      <button class="iconBtn" id="settingsBtn" aria-label="설정 열기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h6M14 7h6"></path><circle cx="12" cy="7" r="2"></circle><path d="M4 12h11M19 12h1"></path><circle cx="17" cy="12" r="2"></circle><path d="M4 17h2M10 17h10"></path><circle cx="8" cy="17" r="2"></circle></svg>
      </button>
    </header>

    <main>
      <section class="screen active" id="home" aria-label="홈"></section>
      <section class="screen" id="account" aria-label="계좌"></section>
      <section class="screen" id="analysis" aria-label="분석"></section>
      <section class="screen" id="future" aria-label="미래"></section>
    </main>
  </div>

  <nav class="nav" aria-label="주요 메뉴">
    <button class="active" data-screen="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 10v10h13V10"></path><path d="M9.5 20v-6h5v6"></path></svg><span>홈</span></button>
    <button data-screen="account"><svg viewBox="0 0 24 24" aria-hidden="true"><rect height="18" rx="2" width="16" x="4" y="3"></rect><path d="M8 7h8M8 11h8M8 15h5"></path></svg><span>계좌</span></button>
    <button data-screen="analysis"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg><span>분석</span></button>
    <button data-screen="future"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span>미래</span></button>
  </nav>

  <button class="fab" id="fab" aria-label="기록 추가. 길게 누르면 숨김">＋</button>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modalSheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modalHead"><h2 class="modalTitle" id="modalTitle"></h2><button class="modalClose" aria-label="창 닫기">×</button></div>
      <div class="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>이 앱을 사용하려면 JavaScript를 켜야 합니다.</noscript>
  <script type="module" src="app.js?v=4.1.0"></script>
</body>
</html>
