function buildChart(data,{xValue,yValue,cValue,xLabels,yLabels,idPrefix}){const W=620,H=250,pad={l:58,r:18,t:18,b:35},max=Math.max(...data.map(d=>Math.max(yValue(d),cValue(d))),1),min=0,x=(i)=>pad.l+(W-pad.l-pad.r)*(data.length===1?.5:i/(data.length-1)),y=v=>pad.t+(H-pad.t-pad.b)*(1-(v-min)/(max-min));const pts=data.map((d,i)=>({x:x(i),y:y(yValue(d)),cy:y(cValue(d))}));const grid=[0,.5,1].map(t=>{const yy=pad.t+(H-pad.t-pad.b)*(1-t),v=max*t;return `<line class="gridLine" x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}"></line><text class="axisText" x="${pad.l-8}" y="${yy+3}" text-anchor="end">${man(v)}</text>`}).join('');const labels=xLabels.map(([i,label])=>`<text class="axisText" x="${x(i)}" y="${H-10}" text-anchor="middle">${label}</text>`).join('');return {W,H,pad,max,pts,svg:`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#176fe5" stop-opacity=".16"></stop><stop offset="100%" stop-color="#176fe5" stop-opacity="0"></stop></linearGradient></defs>${grid}${labels}<path class="area" d="${linePath(pts.map(p=>({x:p.x,y:p.y})))} L ${pts.at(-1).x} ${H-pad.b} L ${pts[0].x} ${H-pad.b} Z"></path><path class="contribLine" d="${linePath(pts.map(p=>({x:p.x,y:p.cy})))}"></path><path class="totalLine" d="${linePath(pts.map(p=>({x:p.x,y:p.y})))}"></path><line class="selectedLine" id="${idPrefix}Line" x1="${pts[0].x}" x2="${pts[0].x}" y1="${pad.t}" y2="${H-pad.b}"></line><circle class="selectedDot" id="${idPrefix}Dot" cx="${pts[0].x}" cy="${pts[0].y}" r="8"></circle><rect class="chartHit" id="${idPrefix}Hit" x="${pad.l}" y="${pad.t}" width="${W-pad.l-pad.r}" height="${H-pad.t-pad.b}"></rect></svg>`}}
function bindChart(hitId,data,chart,update){const hit=document.getElementById(hitId);if(!hit)return;const nearest=e=>{const r=hit.getBoundingClientRect(),px=clamp((e.clientX-r.left)/r.width,0,1),i=Math.round(px*(data.length-1));return clamp(i,0,data.length-1)};let dragging=false;hit.onpointerdown=e=>{dragging=true;document.body.classList.add('charting');try{hit.setPointerCapture(e.pointerId)}catch(_e){}update(nearest(e),false)};hit.onpointermove=e=>{if(dragging)update(nearest(e),false)};hit.onpointerup=e=>{if(!dragging)return;dragging=false;document.body.classList.remove('charting');update(nearest(e),true)};hit.onpointercancel=()=>{dragging=false;document.body.classList.remove('charting')}}

function renderClassRows(){const el=document.getElementById('classRows');el.innerHTML=settingsDraft.settings.assetClasses.map((c,i)=>`<div class="classRow"><input class="className" data-i="${i}" maxlength="12" value="${esc(c.name)}" aria-label="자산군 이름"><input class="classTarget" data-i="${i}" type="number" inputmode="decimal" min="0" max="100" step="0.1" value="${c.target}" aria-label="목표 비중"><button class="removeBtn" data-remove="${i}" aria-label="자산군 삭제">×</button></div>`).join('');const sync=()=>{document.querySelectorAll('.className').forEach(x=>settingsDraft.settings.assetClasses[x.dataset.i].name=x.value.trim());document.querySelectorAll('.classTarget').forEach(x=>settingsDraft.settings.assetClasses[x.dataset.i].target=Number(x.value)||0);const sum=settingsDraft.settings.assetClasses.reduce((s,c)=>s+Number(c.target||0),0),sumEl=document.getElementById('targetSum');sumEl.textContent=`목표 합계 ${sum.toFixed(1)}%`;sumEl.className=`targetSum ${Math.abs(sum-100)<.01?'ok':'bad'}`};document.querySelectorAll('.className,.classTarget').forEach(x=>x.oninput=sync);document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{sync();const c=settingsDraft.settings.assetClasses[Number(b.dataset.remove)],used=Object.values(state.accounts).some(a=>a.holdings.some(h=>h.class===c.id));if(used)return toast('보유상품이 연결돼 있어 삭제할 수 없어요');settingsDraft.settings.assetClasses.splice(Number(b.dataset.remove),1);renderClassRows()});sync()}

function renderSnapshotForm(title,body){title.textContent='자산현황 갱신';body.innerHTML=`<div class="sheetNotice">계좌 총액만 입력하면 기존 보유상품은 유지하고 현금만 맞춰요. 종목표를 붙여넣으면 보유상품 목록을 새 내용으로 교체합니다.</div><div class="field"><label>계좌</label><select id="snapAccount"><option value="pension">연금저축</option><option value="irp">IRP</option></select></div><div class="field"><label>현재 계좌 총액 · 선택</label><input id="snapTotal" inputmode="numeric" placeholder="예: 35,000,000"><div class="inputHelp">종목표 없이 총액만 입력해도 됩니다.</div></div><div class="field"><label>여러 종목 붙여넣기</label><textarea id="snapText" rows="7" placeholder="종목명 | 수량 | 평가금액 | 원금 | 자산군\nRISE 미국나스닥100 | 176 | 14,000,000 | 10,800,000 | 성장주"></textarea></div><div class="settingsInfo" id="snapPreview">붙여넣으면 추가·변경·제외 예정 항목을 확인할 수 있어요.</div><button class="btn primary full" id="applySnapshot" style="margin-top:14px">확인한 내용 반영</button>`;const getData=()=>{const key=document.getElementById('snapAccount').value,a=state.accounts[key],rows=parseHoldingText(document.getElementById('snapText').value),total=parseMoney(document.getElementById('snapTotal').value),old=new Map(a.holdings.map(h=>[h.name,h])),names=rows.map(r=>r.name),dupes=[...new Set(names.filter((n,i)=>names.indexOf(n)!==i))],invalid=rows.filter(r=>![r.qty,r.value,r.cost].every(Number.isFinite)||r.qty<0||r.value<0||r.cost<0),added=rows.filter(r=>!old.has(r.name)),changed=rows.filter(r=>old.has(r.name)&&(old.get(r.name).value!==r.value||old.get(r.name).cost!==r.cost||old.get(r.name).qty!==r.qty)),removed=a.holdings.filter(h=>rows.length&&!rows.some(r=>r.name===h.name)),sum=rows.reduce((s,r)=>s+(Number.isFinite(r.value)?r.value:0),0),existingSum=a.holdings.reduce((s,h)=>s+h.value,0),diff=total?(rows.length?total-sum:total-existingSum):null;return {key,a,rows,total,dupes,invalid,added,changed,removed,sum,existingSum,diff}};const update=()=>{const d=getData(),names=d.rows.slice(0,3).map(r=>esc(r.name)).join(' · '),issues=[];if(d.dupes.length)issues.push(`중복 종목 ${d.dupes.length}개`);if(d.invalid.len function parseHistory(text){
 const out=[],errors=[];
 String(text||'').split(/\n+/).forEach((raw,idx)=>{const line=raw.trim();if(!line)return;const p=line.split(/\s*[|\t]\s*/);if(p.length<3){errors.push(idx+1);return}const year=Number(String(p[0]).replace(/[^0-9]/g,'')),end=parseMoney(p[1]),cumulative=parseMoney(p[2]),dividend=parseMoney(p[3]||0);if(year<1990||year>2100||end<0||cumulative<0){errors.push(idx+1);return}out.push({year,end,cumulative,dividend})});
 out.sort((a,b)=>a.year-b.year);return {rows:out,errors};
}

<script id="v0-stable-script">
(()=>{
'use strict';
const STABLE_VERSION='0.0.0-stable';
const ANALYSIS_ENGINE_VERSION='rules-0.1';
const ACCOUNT_KEYS=['pension','irp'];
const ACCOUNT_LABEL={all:'전체',pension:'연금저축',irp:'IRP'};

function copyYearRow(row,ratio){
  const r=clone(row||{}),num=k=>Math.round((Number(r[k])||0)*ratio);
  return {start:num('start'),end:num('end'),cumulative:num('cumulative'),contribution:num('contribution'),operating:num('operating'),realized:num('realized'),return:Number(r.return)||0,dividend:num('dividend'),reinvested:num('reinvested'),monthly:(r.monthly||Array(12).fill(0)).map(v=>Math.round((Number(v)||0)*ratio))};
}
function ensureAccountYears(){
  state.accountYears=state.accountYears||{pension:{},irp:{}};
  state.meta=state.meta||{};state.meta.accountHistoryEstimated=state.meta.accountHistoryEstimated||{};
  const totals={pension:accountTotal(state.accounts.pension),irp:accountTotal(state.accounts.irp)},sum=Math.max(1,totals.pension+totals.irp);
  for(const key of ACCOUNT_KEYS){
    state.accountYears[key]=state.accountYears[key]||{};
    if(!Object.keys(state.accountYears[key]).length){
      const ratio=totals[key]/sum;
      for(const [year,row] of Object.entries(state.years||{}))state.accountYears[key][year]=copyYearRow(row,ratio);
      state.meta.accountHistoryEstimated[key]=true;
    }
  }
}
function ensureAccountYear(key,year=CURRENT_YEAR){
  ensureAccountYears();
  if(!state.accountYears[key][year])state.accountYears[key][year]={start:accountTotal(state.accounts[key]),end:accountTotal(state.accounts[key]),cumulative:Number(state.accounts[key].principal)||0,contribution:0,operating:0,realized:0,return:0,dividend:0,reinvested:0,monthly:Array(12).fill(0)};
  const row=state.accountYears[key][year];row.monthly=Array.isArray(row.monthly)?row.monthly.slice(0,12):Array(12).fill(0);while(row.monthly.length<12)row.monthly.push(0);return row;
}
function syncCurrentAccountYears(){
  ensureAccountYears();
  for(const key of ACCOUNT_KEYS){
    const row=ensureAccountYear(key,CURRENT_YEAR),a=state.accounts[key];row.end=accountTotal(a);row.cumulative=Number(a.principal)||0;row.operating=row.end-(Number(row.start)||0)-(Number(row.contribution)||0);const base=(Number(row.start)||0)+(Number(row.contribution)||0)/2;row.return=base?row.operating/base*100:0;
  }
}
ensureAccountYears();syncCurrentAccountYears();state.meta.appVersion=STABLE_VERSION;

const oldUpdateYearStable=updateYearFromAssets;
updateYearFromAssets=function(){oldUpdateYearStable();syncCurrentAccountYears()};

function analysisRows(scope){
  const source=scope==='all'?state.years:state.accountYears?.[scope]||{};
  return Object.keys(source).map(Number).sort((a,b)=>a-b).map(year=>({year,...source[year]}));
}
function contributionStatusText(){
  const status=currentContributionStatus(),planned=ACCOUNT_KEYS.filter(k=>Number(state.settings.monthly[k])>0);
  if(!planned.length)return {planned,total:0,label:'납입 계획 없음',chips:[]};
  const chips=planned.map(k=>({key:k,name:ACCOUNT_LABEL[k],done:!!status[k],amount:Number(state.settings.monthly[k])||0}));
  const done=chips.filter(x=>x.done).length;
  return {planned,total:chips.reduce((s,x)=>s+x.amount,0),label:done===chips.length?'이번 달 완료':done?`${done}/${chips.length} 계좌 완료`:'아직 기록 전',chips};
}

renderHome=function(){
  const total=totalAsset(),principal=totalPrincipal(),profit=total-principal,ret=principal?profit/principal*100:0,goal=goalStatus(),status=contributionStatusText();
  const accountCards=Object.entries(state.accounts).map(([k,a])=>{const at=accountTotal(a),ap=at-a.principal,share=total?at/total*100:0;return `<button class="accountLink" data-account-link="${k}"><div><strong>${esc(a.name)}</strong><small class="tiny">전체의 ${share.toFixed(1)}%</small></div><span class="go">›</span><div class="accountStats"><div><span>원금</span><b>${man(a.principal)}</b></div><div><span>손익</span><b class="${ap>=0?'good':'bad'}">${ap>=0?'+':''}${man(ap)}</b></div><div><span>수익률</span><b class="${accountReturn(a)>=0?'good':'bad'}">${pct(accountReturn(a))}</b></div></div></button>`}).join('');

function topHolding(scope='all'){
  const holdings=[];for(const key of ACCOUNT_KEYS){if(scope!=='all'&&scope!==key)continue;for(const h of state.accounts[key].holdings)holdings.push({...h,account:key})}
  const total=holdings.reduce((s,h)=>s+(Number(h.value)||0),0)+(scope==='all'?state.accounts.pension.cash+state.accounts.irp.cash:state.accounts[scope].cash);
  holdings.sort((a,b)=>b.value-a.value);return {holding:holdings[0]||null,pct:total&&holdings[0]?holdings[0].value/total*100:0,total};
}
function stableDateAge(){
  const raw=String(state.lastUpdated||'').replace(/\./g,'-'),d=new Date(raw+'T00:00:00');
  if(Number.isNaN(d.getTime()))return {days:null,label:'갱신일 확인 필요'};
  const days=Math.max(0,Math.floor((Date.now()-d.getTime())/86400000));
  return {days,label:days===0?'오늘 갱신':days===1?'어제 갱신':`${days}일 전 갱신`};
}
function projectedAtRate(rate,monthlyExtra=0){
  const years=Math.max(1,state.profile.retirementAge-state.profile.age),monthly=Number(state.settings.monthly.pension)+Number(state.settings.monthly.irp)+monthlyExtra;let bal=totalAsset();for(let y=0;y<years;y++){const rm=Math.pow(1+rate/100,1/12)-1;for(let m=0;m<12;m++){bal+=monthly;bal*=1+rm}}return bal;
}
function runSmartAnalysis(){
  const life=lifecycleAnalysis(),goal=goalStatus(),yearsLeft=state.profile.retirementAge-state.profile.age,top=topHolding('all'),irp=state.accounts.irp,irpTotal=accountTotal(irp),irpRisk=irpTotal?irp.holdings.filter(h=>h.risk!==false).reduce((s,h)=>s+h.value,0)/irpTotal*100:0,age=stableDateAge();
  const classes=state.settings.assetClasses.map(c=>{const totals=classTotals(),all=Object.values(totals).reduce((s,n)=>s+n,0)||1,cur=(totals[c.id]||0)/all*100;return {name:c.name,diff:cur-c.target,cur,target:c.target}}),largestGap=[...classes].sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff))[0];
  const recent=Object.keys(state.years).map(Number).sort((a,b)=>b-a).slice(0,3).map(y=>state.years[y]);const planned=(Number(state.settings.monthly.pension)+Number(state.settings.monthly.irp))*12,consistency=planned?recent.filter(r=>(Number(r.contribution)||0)>=planned*.8).length/Math.max(1,recent.length)*100:100;
  let score=100,issues=[];const add=(severity,title,body)=>{issues.push({severity,title,body});score-=severity};
  if(age.days!=null&&age.days>30)add(12,'자산현황이 오래됐어요',`${age.days}일 전 자료입니다. 분석 정확도를 위해 계좌 현황을 먼저 갱신하세요.`);
  if(Math.abs(largestGap?.diff||0)>12)add(14,'목표 비중과 차이가 큽니다',`${largestGap.name}이 목표보다 ${Math.abs(largestGap.diff).toFixed(1)}%p ${largestGap.diff>0?'높습니다':'낮습니다'}. 다음 납입으로 천천히 조정하는 편이 낫습니다.`);else if(Math.abs(largestGap?.diff||0)>6)add(7,'자산배분을 점검할 구간입니다',`${largestGap.name}이 목표와 ${Math.abs(largestGap.diff).toFixed(1)}%p 차이 납니다.`);
  if(top.pct>40)add(15,'한 종목 집중도가 높습니다',`${top.holding?.name||'상위 종목'}이 전체의 ${top.pct.toFixed(1)}%입니다. 추가 매수 전 다른 자산군과 균형을 확인하세요.`);else if(top.pct>30)add(8,'상위 종목 비중을 지켜보세요',`${top.holding?.name||'상위 종목'}이 전체의 ${top.pct.toFixed(1)}%입니다.`);
  if(goal.p<60)add(16,'목표 월연금과 간격이 큽니다',`현재 계획의 목표 달성률은 ${goal.p.toFixed(0)}%입니다. 수익률을 무리하게 높이기보다 납입액·은퇴 시점을 함께 비교하세요.`);else if(goal.p<85)add(9,'목표 월연금까지 보완이 필요합니다',`현재가치 기준 월 ${man(Math.max(0,goal.gap))}가 부족한 추정입니다.`);
  if(consistency<67)add(8,'최근 납입 지속성이 낮습니다',`최근 ${recent.length}년 중 계획의 80% 이상 납입한 해가 ${Math.round(consistency/100*recent.length)}년입니다.`);
  if(irpRisk>70.2)add(20,'IRP 위험자산 한도를 확인하세요',`현재 계산상 위험자산 비중이 ${irpRisk.toFixed(1)}%입니다. 상품의 실제 위험자산 분류와 주문 가능 여부를 증권사에서 확인하세요.`);
  if(!issues.length)issues.push({severity:0,title:'현재 구조는 크게 흔들리지 않습니다',body:'새 종목을 늘리기보다 정기 납입과 주기적인 현황 갱신을 유지하는 것이 우선입니다.'});
  issues.sort((a,b)=>b.severity-a.severity);score=clamp(score,0,100);
  const base=projectedAtRate(Number(state.settings.returnRate)),lower=projectedAtRate(Number(state.settings.returnRate)-1),extra=projectedAtRate(Number(state.settings.returnRate),100000);

  return {score,label,life,goal,yearsLeft,top,irpRisk,consistency,issues:issues.slice(0,4),scenario:{base,lower,extra}};

function parseHistoryStable(text){
  const rows=[],errors=[];
  String(text||'').split(/\n+/).forEach((raw,idx)=>{
    const line=raw.trim();if(!line)return;
    const parts=line.split(/\s*[|\t]\s*/);
    if(parts.length<3){errors.push(idx+1);return}
    const year=Number(String(parts[0]).replace(/[^0-9]/g,'')),end=parseMoney(parts[1]),cumulative=parseMoney(parts[2]),dividend=parseMoney(parts[3]||0);
    if(year<1990||year>2100||end<0||cumulative<0||dividend<0){errors.push(idx+1);return}
    rows.push({year,end,cumulative,dividend});
  });
  rows.sort((a,b)=>a.year-b.year);return {rows,errors};
}

/* Photo viewer: enlarge the actual scrollable canvas, not only a visual transform. */
function upgradePhotoViewer(){
  const viewer=document.getElementById('photoViewer');if(!viewer||viewer.dataset.stable)return;viewer.dataset.stable='1';const body=viewer.querySelector('.photoViewerBody'),img=viewer.querySelector('img');let stage=viewer.querySelector('.photoStage');if(!stage){stage=document.createElement('div');stage.className='photoStage';img.replaceWith(stage);stage.appendChild(img)}let scale=1,rotation=0;
  const paint=()=>{const inner=Math.max(240,body.clientWidth-28),ratio=img.naturalWidth?img.naturalHeight/img.naturalWidth:2.1,baseW=inner,baseH=inner*ratio,w=baseW*scale,h=baseH*scale,side=rotation%180!==0;stage.style.width=`${side?h:w}px`;stage.style.height=`${side?w:h}px`;img.style.width=`${w}px`;img.style.height=`${h}px`;img.style.transform=`translate(-50%,-50%) rotate(${rotation}deg)`};
  img.addEventListener('load',paint);new ResizeObserver(paint).observe(body);
  viewer.querySelector('[data-pv=plus]').onclick=()=>{scale=clamp(scale+.25,1,3);paint()};viewer.querySelector('[data-pv=minus]').onclick=()=>{scale=clamp(scale-.25,1,3);paint()};viewer.querySelector('[data-pv=rotate]').onclick=()=>{rotation=(rotation+90)%360;paint()};
  const close=()=>{viewer.classList.remove('open');document.body.style.overflow=''};viewer.querySelector('[data-pv=close]').onclick=close;viewer.addEventListener('click',e=>{if(e.target===viewer)close()});
  window.openPhotoViewer=src=>{if(!src)return;scale=1;rotation=0;img.src=src;viewer.classList.add('open');document.body.style.overflow='hidden';requestAnimationFrame(()=>{paint();body.scrollTo(0,0)})};
}
upgradePhotoViewer();

/* FAB auto-hide after 10 seconds; any touch/scroll/navigation wakes it. */
let fabTimer=null;
function wakeFab(){document.body.classList.remove('fabIdle');document.body.classList.add('fabWake');clearTimeout(fabTimer);fabTimer=setTimeout(()=>{document.body.classList.add('fabIdle');document.body.classList.remove('fabWake')},10000);setTimeout(()=>document.body.classList.remove('fabWake'),260)}
window.wakeFab=wakeFab;
['pointerdown','scroll','keydown'].forEach(type=>window.addEventListener(type,wakeFab,{passive:true}));

<script id="v1-data-script">
(()=>{

}

  if(data.appId!=='asset-os-pension')add('개인연금 데이터가 아닙니다.');
  const schema=Number(data.schemaVersion)||1;if(schema>V1_SCHEMA_VERSION)add(`더 새로운 데이터 구조입니다: ${schema}`);
  if(!data.accounts?.pension||!data.accounts?.irp)add('연금저축 또는 IRP 계좌가 없습니다.');

    if(!a.id||accountIds.has(a.id))add('계좌 고유번호가 없거나 중복되었습니다.');accountIds.add(a.id);
    if([a.principal,a.cash].some(v=>!Number.isFinite(Number(v))||Number(v)<0))add(`${key} 계좌 금액 형식이 올바르지 않습니다.`);
    if(!Array.isArray(a.holdings)){add(`${key} 보유상품 목록 형식이 올바르지 않습니다.`);continue}
    for(const h of a.holdings){
      if(!h.id||holdingIds.has(h.id))add('보유상품 고유번호가 없거나 중복되었습니다.');holdingIds.add(h.id);
      if(!String(h.name||'').trim())add('이름이 없는 보유상품이 있습니다.');
      if([h.qty,h.value,h.cost].some(v=>!Number.isFinite(Number(v))||Number(v)<0))add(`${h.name||'보유상품'}의 수량 또는 금액이 올바르지 않습니다.`);
    }
  }
  const allowed=new Set(['contribution','dividend','buy','sell','snapshot','adjustment']),recordIds=new Set();
  for(const r of data.ledger||[]){
    if(!r.id||recordIds.has(r.id))add('기록 고유번호가 없거나 중복되었습니다.');recordIds.add(r.id);

    if(!Number.isFinite(Number(r.amount)))add(`기록 금액이 올바르지 않습니다: ${r.id||'번호 없음'}`);

    if(r.accountId&&!accountIds.has(r.accountId))add(`존재하지 않는 계좌를 참조합니다: ${r.id||'번호 없음'}`);
    if(r.assetId&&!holdingIds.has(r.assetId))add(`존재하지 않는 보유상품을 참조합니다: ${r.id||'번호 없음'}`);
  }
  const snapshotIds=new Set();for(const x of data.snapshots||[]){if(!x.id||snapshotIds.has(x.id))add('스냅샷 고유번호가 없거나 중복되었습니다.');snapshotIds.add(x.id);if(!x.createdAt||Number.isNaN(Date.parse(x.createdAt)))add(`스냅샷 날짜가 올바르지 않습니다: ${x.id||'번호 없음'}`);if(!x.accounts||typeof x.accounts!=='object')add(`스냅샷 계좌 데이터가 없습니다: ${x.id||'번호 없음'}`)}
  try{JSON.stringify(data)}catch(_){add('JSON으로 변환할 수 없는 데이터가 있습니다.')}
  return {ok:!errors.length,errors};
}

async function v1VerifyBackup(input){
  const errors=[];try{
    const files=await v1ZipRead(input);for(const req of V1_REQUIRED)if(!files[req]||!files[req].length)errors.push(`필수 파일 누락: ${req}`);if(errors.length)return {ok:false,errors};
    const manifest=JSON.parse(v1Dec.decode(files['manifest.json']));if(manifest.appId!=='asset-os-pension')errors.push('다른 앱의 백업입니다.');if(Number(manifest.schemaVersion)>V1_SCHEMA_VERSION)errors.push(`더 새로운 데이터 구조입니다: ${manifest.schemaVersion}`);
    const envelope=JSON.parse(v1Dec.decode(files['full-backup.json'])),data=envelope.data||envelope;if(data.appId!=='asset-os-pension')errors.push('백업 원본의 앱 종류가 일치하지 않습니다.');
    for(const [name,info] of Object.entries(manifest.files||{})){if(!files[name]){errors.push(`체크섬 대상 누락: ${name}`);continue}const actual=await v1Sha(files[name]);if(actual!==info.sha256)errors.push(`체크섬 불일치: ${name}`);if(Number(info.bytes)!==files[name].length)errors.push(`파일 크기 불일치: ${name}`)}
    const counts=v1Counts(data);for(const key of ['accounts','holdings','transactions','contributions','dividends','snapshots','years','totalAssets'])if(Number(counts[key])!==Number(manifest.counts?.[key]))errors.push(`데이터 개수 또는 합계 불일치: ${key}`);
    let migrated=null;try{migrated=v1MigrateImported(data)}catch(e){errors.push(String(e?.message||e))}if(migrated){const valid=v1ValidateData(migrated);if(!valid.ok)errors.push(...valid.errors)}
    return {ok:!errors.length,errors,files,manifest,data};
  }catch(e){return {ok:false,errors:[String(e?.message||e)]}}
}

async function v1DriveBackup(){try{v1ShowResult('Drive 백업 준비 중','검증 ZIP을 만들고 있습니다.');const pack=await v1BuildBackup(),drive=v1Adapters().drive;if(drive?.upload){const result=await drive.upload(new File([pack.blob],pack.fileName,{type:'application/zip'}),{folder:'투자시스템/pension',manifest:pack.manifest});if(drive.download&&result?.fileId){const remote=await drive.download(result.fileId),hashA=await v1Sha(pack.bytes),hashB=await v1Sha(new Uint8Array(await remote.arrayBuffer()));if(hashA!==hashB)throw new Error('Drive 재다운로드 체크섬이 일치하지 않습니다.')}state.meta.storage.driveStatus='정상';state.meta.storage.lastDriveBackup=v1LocalTime();save();v1ShowResult('Drive 백업 검증 완료',`${esc(pack.fileName)}<br>업로드 응답과 체크섬을 확인했습니다.`);return}const file=new File([pack.blob],pack.fileName,{type:'application/zip'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:'개인연금 검증 백업',text:'Google Drive를 선택해 pension 폴더에 저장하세요.',files:[file]});state.meta.storage.driveStatus='공유 완료';state.meta.storage.lastDriveBackup=v1LocalTime();save();v1ShowResult('공유창 전달 완료',`검증된 ${esc(pack.fileName)}을 전달했습니다.<br>공유 대상에서 Google Drive를 선택했는지 확인하세요.`)}else{v1Download(pack.blob,pack.fileName);v1ShowResult('검증 ZIP 다운로드 완료',`직접 Drive API가 연결되지 않아 폰으로 내려받았습니다.<br>Google Drive의 투자시스템/pension 폴더에 올려주세요.`)}}catch(e){v1ShowResult('Drive 백업 중단',esc(e?.message||e),true)}}

async function v1ReadRestoreFile(file){if(!file)return;try{v1ShowResult('백업 검사 중',`${esc(file.name)}의 구조와 체크섬을 확인합니다.`);const bytes=new Uint8Array(await file.arrayBuffer());if(file.name.toLowerCase().endsWith('.zip')||bytes[0]===0x50&&bytes[1]===0x4b){const verified=await v1VerifyBackup(bytes);if(!verified.ok)throw new Error(verified.errors[0]);v1RestoreCandidate={data:verified.data,manifest:verified.manifest,source:'zip',fileName:file.name}}else{const parsed=JSON.parse(v1Dec.decode(bytes)),data=parsed.data||parsed;v1RestoreCandidate={data,manifest:{schemaVersion:parsed.schemaVersion||data.schemaVersion,appVersion:parsed.appVersion||data.meta?.appVersion,createdAt:parsed.createdAt||data.meta?.updatedAt,counts:v1Counts(data)},source:'json',fileName:file.name}}v1RenderRestorePreview()}catch(e){v1RestoreCandidate=null;v1ShowResult('복원 파일 거부',esc(e?.message||e),true)}}

function v1MigrateImported(input){
  const copy=clone(input);let version=Number(copy.schemaVersion)||1;
  if(copy.appId&&copy.appId!=='asset-os-pension')throw new Error('다른 앱의 데이터입니다.');
  if(!copy.appId&&version>=4)throw new Error('앱 식별자가 없는 데이터입니다.');
  if(version>V1_SCHEMA_VERSION)throw new Error(`이 백업은 더 새로운 데이터 구조(${version})입니다.`);
  copy.appId='asset-os-pension';
  while(version<V1_SCHEMA_VERSION){
    if(version===1){copy.runtime=copy.runtime||{contributions:{}};copy.dividendsByAsset=copy.dividendsByAsset||{};version=2;}
    else if(version===2){copy.accountYears=copy.accountYears||{pension:{},irp:{}};copy.meta=copy.meta||{};version=3;}
    else if(version===3){copy.ledger=Array.isArray(copy.ledger)?copy.ledger:[];copy.snapshots=Array.isArray(copy.snapshots)?copy.snapshots:[];version=4;}
    else if(version===4){copy.settings=copy.settings||{};copy.settings.annualContributionLimit=Number(copy.settings.annualContributionLimit)||18000000;copy.settings.taxCreditLimit=Number(copy.settings.taxCreditLimit)||9000000;version=5;}
    else throw new Error(`변환 경로가 없는 데이터 구조입니다: ${version}`);
    copy.schemaVersion=version;
  }
  return v1EnsureState(copy);
}

function v1RenderRestorePreview(){if(!v1RestoreCandidate)return;try{const migrated=v1MigrateImported(v1RestoreCandidate.data),valid=v1ValidateData(migrated);if(!valid.ok)throw new Error(valid.errors[0]);v1RestoreCandidate.migrated=migrated;const c=v1Counts(migrated),m=v1RestoreCandidate.manifest||{},el=document.getElementById('v1RestorePreview');el.className='restorePreview open';el.innerHTML=`<h4>복원 미리보기</h4><div class="previewGrid"><div class="previewCell"><small>백업 앱 버전</small><b>${esc(m.appVersion||migrated.meta?.appVersion||'확인 불가')}</b></div><div class="previewCell"><small>데이터 구조 변환</small><b>${Number(v1RestoreCandidate.data.schemaVersion)||1} → ${V1_SCHEMA_VERSION}</b></div><div class="previewCell"><small>계좌·보유상품</small><b>${c.accounts}개 · ${c.holdings}개</b></div><div class="previewCell"><small>기록·스냅샷</small><b>${c.transactions}건 · ${c.snapshots}건</b></div><div class="previewCell"><small>총자산</small><b>${fmt(c.totalAssets)}</b></div><div class="previewCell"><small>검사 결과</small><b class="good">오류 없음</b></div></div><div class="restoreButtons"><button class="btn" id="v1CancelRestore">취소</button><button class="btn primary" id="v1ApplyRestore">안전백업 후 복원</button></div>`;document.getElementById('v1CancelRestore').onclick=()=>{v1RestoreCandidate=null;el.className='restorePreview';el.innerHTML=''};document.getElementById('v1ApplyRestore').onclick=v1ApplyRestore;v1ShowResult('복원 가능','원본은 아직 변경하지 않았습니다. 미리보기 확인 후 적용하세요.')}catch(e){v1RestoreCandidate=null;v1ShowResult('복원 데이터 거부',esc(e?.message||e),true)}}
async function v1ApplyRestore(){if(!v1RestoreCandidate?.migrated)return;const original=clone(state);try{v1ShowResult('복원 전 안전백업 생성 중','현재 데이터를 별도 보관한 뒤 복사본에서 변환합니다.');const safety=await v1BuildBackup(original);await v1DBPut(V1_SAFETY,{createdAt:v1DateTime(),fileName:safety.fileName,blob:safety.blob,manifest:safety.manifest});const incoming=clone(v1RestoreCandidate.migrated),valid=v1ValidateData(incoming);if(!valid.ok)throw new Error(valid.errors[0]);state=incoming;state.meta.storage.lastRestore=v1LocalTime();state.meta.storage.lastValidation='복원 정상';lastSignature=dataSignature(state);v1LastCore=v1CoreSignature(state);save();await v1PersistNow();renderAll(true);v1RestoreCandidate=null;v1ShowResult('복원 완료',`현재 데이터 교체 전 안전백업을 기기에 보관했습니다.<br>계좌 ${v1Counts(state).accounts}개 · 총자산 ${fmt(v1Counts(state).totalAssets)}`)}catch(e){state=original;lastSignature=dataSignature(state);v1LastCore=v1CoreSignature(state);renderAll(true);v1ShowResult('복원 실패 · 기존 데이터 유지',esc(e?.message||e),true)}}

v1CreateDataSheet();
const v1RenderSettings=renderSettings;
renderSettings=function(){v1EnsureState();v1RenderSettings();const body=document.getElementById('settingsBody'),saveBar=body.querySelector('.saveBar');if(!body||!saveBar)return;const limits=document.createElement('div');limits.className='settingsSection';limits.innerHTML=`<div class="settingsTitle">연간 납입 한도</div><div class="field"><label>연금계좌 총 납입 한도</label><input id="setAnnualLimit" type="text" inputmode="numeric" value="${Number(state.settings.annualContributionLimit).toLocaleString('ko-KR')}"><div class="fieldHint">홈의 올해 총납입 카드에 사용합니다.</div></div><div class="field"><label>세액공제 한도</label><input id="setTaxLimit" type="text" inputmode="numeric" value="${Number(state.settings.taxCreditLimit).toLocaleString('ko-KR')}"><div class="fieldHint">제도 변경에 맞춰 직접 수정할 수 있습니다.</div></div>`;body.insertBefore(limits,saveBar);const data=document.createElement('div');data.className='settingsSection';data.innerHTML=`<div class="settingsTitle">데이터 안정성과 저장</div><button class="dataLaunch" id="openDataCenter"><span><b>3중 저장·ZIP 백업</b><small>기기 · 클라우드 · Google Drive 상태와 복원을 관리합니다.</small></span><span>›</span></button>`;body.insertBefore(data,saveBar);for(const id of ['setAnnualLimit','setTaxLimit']){const input=document.getElementById(id);input.addEventListener('blur',()=>{const n=parseMoney(input.value);input.value=n?Number(n).toLocaleString('ko-KR'):''})}document.getElementById('openDataCenter').onclick=()=>{closeSheet('settingsSheet');setTimeout(()=>{v1RefreshDataCenter();openSheet('dataSheet')},180)};const oldClick=document.getElementById('saveSettings').onclick;document.getElementById('saveSettings').onclick=()=>{settingsDraft.settings.annualContributionLimit=parseMoney(document.getElementById('setAnnualLimit').value);settingsDraft.settings.taxCreditLimit=parseMoney(document.getElementById('setTaxLimit').value);if(settingsDraft.settings.taxCreditLimit>settingsDraft.settings.annualContributionLimit){document.getElementById('settingsError').textContent='세액공제 한도는 총 납입 한도보다 클 수 없어요.';return}oldClick()};const notice=body.querySelector('.sheetNotice');if(notice)notice.textContent=`저장 버튼을 눌러야 반영됩니다. 앱 ${V1_APP_VERSION} · 데이터 구조 ${V1_SCHEMA_VERSION}`};

v1EnsureState();v1LastCore=v1CoreSignature(state);state.meta.appVersion=V1_APP_VERSION;state.schemaVersion=V1_SCHEMA_VERSION;renderAll(true);v1FabShow();setTimeout(v1Hydrate,0);
})();
